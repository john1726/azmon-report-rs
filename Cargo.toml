[package]
name = "azmon-report"
version = "0.1.0"
edition = "2021"
description = "Run Azure Application Insights and Log Analytics queries and generate Markdown, CSV, and JSON reports"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
